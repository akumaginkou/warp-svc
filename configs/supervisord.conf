[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/var/run/supervisord.pid
logfile_maxbytes=0
user=root
; Increase timeout for QNAP systems that may have high latency
childlogdir=/var/log
logfile_maxbytes=0

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:socat]
command=socat -ly tcp-listen:1080,reuseaddr,reuseport,fork tcp:localhost:40000
autostart=true
autorestart=true
startsecs=15
stopasgroup=true
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; QNAP backoff settings to prevent restart loops
startretries=5
retry=10

[program:warp-svc]
command=/scripts/warp.sh
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; QNAP backoff settings to prevent restart loops
startretries=3
retry=10

[program:healthcheck]
command=/scripts/healthcheck.sh
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:logrotate]
command=/scripts/logrotate.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
